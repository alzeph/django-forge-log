name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: django_forge_log
          POSTGRES_USER: django_forge_log
          POSTGRES_PASSWORD: django_forge_log
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:9
        env:
          MYSQL_DATABASE: django_forge_log
          MYSQL_ROOT_PASSWORD: django_forge_log
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - name: Run tests
        env:
          FORGE_LOG_TEST_DB: ${{ matrix.db }}
        run: uv run pytest --cov=forge_log --cov-report=term-missing

  test-django-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["4.2", "5.0", "5.1", "5.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - name: Run tests against Django ${{ matrix.django-version }}
        run: uv run --with "django==${{ matrix.django-version }}.*" pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-django-versions]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
